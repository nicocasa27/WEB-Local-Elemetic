{% extends "produccion/base.html" %}
{% block title %}Taller Elemetic - Editar pieza{% endblock %}
{% block content %}
  <div class="d-flex align-items-start align-items-md-center justify-content-between gap-2 flex-column flex-md-row mb-3">
    <div>
      <div class="kpi-label">Herrería</div>
      <div class="h3 mb-0">Editar pieza</div>
      <div class="text-muted small">{{ pieza.nombre }}</div>
    </div>
    <div class="d-flex gap-2">
      <a class="btn btn-outline-secondary" href="{% url 'catalogos:herreria_catalogo' %}"><i class="bi bi-arrow-left me-1"></i> Volver</a>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post" class="row g-3">
        {% csrf_token %}
        <div class="col-12 col-md-6">
          <label class="form-label">Nombre</label>
          {{ form.nombre }}
        </div>
        <div class="col-12 col-md-3">
          <label class="form-label">Peso (kg)</label>
          {{ form.peso_kg }}
        </div>
        <div class="col-12 col-md-3 d-flex align-items-end">
          <div class="form-check">
            {{ form.activo }}
            <label class="form-check-label">Activa</label>
          </div>
        </div>
        <div class="col-12">
          <button class="btn btn-argon text-white" type="submit"><i class="bi bi-save me-1"></i> Guardar</button>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
